networks:
  infra:
    driver: bridge

services:
  # ---------------------------------------------------------------------
  # OpenProject (config original preservada — apenas adicionado à rede)
  # ---------------------------------------------------------------------
  openproject:
    image: openproject/openproject:14
    container_name: openproject_local
    restart: unless-stopped
    networks:
      - infra
    ports:
      - "8090:80"
    environment:
      - OPENPROJECT_HOST__NAME=localhost:8090
      - OPENPROJECT_HTTPS=false
      - SECRET_KEY_BASE=chave_temporaria_desenvolvimento_local_12345
    volumes:
      - ./data/pgdata:/var/openproject/pgdata
      - ./data/assets:/var/openproject/assets
      - ./data/files:/var/openproject/files

  # ---------------------------------------------------------------------
  # PostgreSQL dedicado ao Nextcloud (separado do banco do OpenProject)
  # ---------------------------------------------------------------------
  nextcloud_db:
    image: postgres:16
    container_name: nextcloud_postgres
    restart: unless-stopped
    networks:
      - infra
    environment:
      - POSTGRES_DB=${NEXTCLOUD_DB_NAME}
      - POSTGRES_USER=${NEXTCLOUD_DB_USER}
      - POSTGRES_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
    volumes:
      - ./data/nextcloud_pgdata:/var/lib/postgresql/data

  # ---------------------------------------------------------------------
  # Redis (cache/locking do Nextcloud)
  # ---------------------------------------------------------------------
  nextcloud_redis:
    image: redis:7-alpine
    container_name: nextcloud_redis
    restart: unless-stopped
    networks:
      - infra
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]

  # ---------------------------------------------------------------------
  # Nextcloud — indexa os anexos do OpenProject em ./data/assets/files
  # (montado somente leitura; OpenProject continua sendo quem escreve)
  # ---------------------------------------------------------------------
  nextcloud:
    image: nextcloud:apache
    container_name: nextcloud_app
    restart: unless-stopped
    networks:
      - infra
    depends_on:
      - nextcloud_db
      - nextcloud_redis
    ports:
      - "8091:80"
    environment:
      - POSTGRES_HOST=nextcloud_db
      - POSTGRES_DB=${NEXTCLOUD_DB_NAME}
      - POSTGRES_USER=${NEXTCLOUD_DB_USER}
      - POSTGRES_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
      - REDIS_HOST=nextcloud_redis
      - REDIS_HOST_PASSWORD=${REDIS_PASSWORD}
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost
    volumes:
      - ./data/nextcloud:/var/www/html
      - ./data/assets/files:/mnt/openproject_files:ro
